# Deploy Catchy to Firebase Hosting.
#
# Set these GitHub Actions secrets (repo → Settings → Secrets → Actions):
#   FIREBASE_TOKEN       — on your PC: `npx firebase-tools login:ci` (browser: lojain2077@gmail.com), copy token
#   FIREBASE_PROJECT_ID  — same as your Firebase project id
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID
# Optional: VITE_ADMIN_EMAIL, VITE_ADMIN_PASSWORD, VITE_OWNER_EMAILS
#
# Run: Actions → "Deploy Firebase Hosting" → Run workflow

name: Deploy Firebase Hosting

on:
  workflow_dispatch:

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_OWNER_EMAILS: ${{ secrets.VITE_OWNER_EMAILS }}

      - name: Deploy Firestore rules and hosting
        run: npx firebase-tools@13 deploy --only firestore,hosting --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
